services:
  metube:
    image: ghcr.io/alexta69/metube
    container_name: metube
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./downloads:/downloads
    environment:
      - DEFAULT_THEME=dark
      - DELETE_FILE_ON_TRASHCAN=true
      - YTDL_OPTIONS={"noplaylist":false}
